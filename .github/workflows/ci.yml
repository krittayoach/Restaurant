name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: unit tests + type check ──────────────────────────────────────
  backend:
    name: Backend — tests & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myplatfrom/backend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test
        env:
          JWT_SECRET: ci-test-secret-minimum-32-chars-xxxxxxxxxxx

  # ─── Frontend: type check ──────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myplatfrom/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

  # ─── E2E: full stack integration tests ────────────────────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_saas
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/restaurant_saas
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-test-secret-minimum-32-chars-xxxxxxxxxxx
      PORT: 3010
      PLATFORM_EMAIL_FROM: noreply@test.com
      APP_URL: http://localhost:3002
      NEXT_PUBLIC_API_URL: http://localhost:3010
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      VAPID_SUBJECT: mailto:test@test.com
      NODE_ENV: production
      LOG_LEVEL: warn
      CI: true

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install backend deps
        run: bun install --frozen-lockfile
        working-directory: myplatfrom/backend

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: myplatfrom/frontend

      - name: Install e2e deps
        run: bun install --frozen-lockfile
        working-directory: myplatfrom/e2e

      - name: Run DB migrations
        run: bun run db:migrate
        working-directory: myplatfrom/backend

      - name: Seed CI data
        run: bun run src/db/ci-seed.ts
        working-directory: myplatfrom/backend

      - name: Seed demo data
        run: bun run src/db/seed-demo.ts
        working-directory: myplatfrom/backend

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: myplatfrom/e2e

      - name: Run E2E tests
        run: bunx playwright test
        working-directory: myplatfrom/e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: myplatfrom/e2e/playwright-report/
          retention-days: 7
